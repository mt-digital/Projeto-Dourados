<script>
document.addEventListener("DOMContentLoaded", () => {
  const normalize = p => p.replace(/\/$/, "/index.html");
  const currentPath = normalize(location.pathname);

  document.querySelectorAll(".hero-nav a").forEach(link => {
    try {
      const linkPath = normalize(new URL(link.href).pathname);
      if (linkPath === currentPath) {
        link.classList.add("active");
      }
    } catch (e) {
      // ignore malformed URLs
    }
  });
});
</script>




<script>
document.addEventListener('DOMContentLoaded', function () {
  const buttons = document.querySelectorAll('[data-bs-toggle="popover"]');

  buttons.forEach(btn => {
    const url = btn.getAttribute('data-url');

    if (url) {
      fetch(url)
        .then(response => response.text())
        .then(html => {
          btn.setAttribute('data-bs-content', html);

          // Create the popover AFTER content is loaded
          new bootstrap.Popover(btn);
        });
    } else {
      // Fallback for inline content
      new bootstrap.Popover(btn);
    }
  });
});
</script>


<!-- CUSTOM HEADER using the term "hero" perhaps idiosyncratically -->
<div class="hero-header">

  <div class="hero-title">Instituto Dourados</div>

  <nav class="hero-nav nav-pt">
    <a href="/pt/index.html">Início</a>
    <a href="/pt/team.html">Equipe</a>
    <a href="/pt/mission.html">Missão</a>
  </nav>

  <nav class="hero-nav nav-en">
    <a href="/en/index.html">Welcome</a>
    <a href="/en/team.html">Team</a>
    <a href="/en/mission.html">Mission</a>
  </nav>

  <div class="hero-lang-switch">
    <a id="switch-pt" data-lang="pt">Português 🇧🇷</a>
    <span class="sep">|</span>
    <a id="switch-en" data-lang="en">English 🇺🇸</a>
  </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

  function currentPath() {
    return window.location.pathname;
  }

  // Switch to PT
  document.querySelector("#switch-pt").addEventListener("click", function (e) {
    e.preventDefault();
    // Get the last .html file from the current URL
    const lastPart = window.location.pathname.split("/").pop();

    // Build an absolute URL using the current domain (localhost or production)
    const newUrl = `${window.location.origin}/pt/${lastPart}`;

    // Navigate to the new URL
    window.location.href = newUrl;
  });

  // Switch to EN
  document.querySelector("#switch-en").addEventListener("click", function (e) {
    e.preventDefault();
    // Get the last .html file from the current URL
    const lastPart = window.location.pathname.split("/").pop();

    // Build an absolute URL using the current domain (localhost or production)
    const newUrl = `${window.location.origin}/en/${lastPart}`;

    // Navigate to the new URL
    window.location.href = newUrl;
  });
});
</script>
